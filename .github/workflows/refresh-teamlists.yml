name: Refresh World Cup team lists
on:
  workflow_dispatch:
  schedule:
    # Slightly off the hour to avoid common GitHub Actions scheduler delays.
    - cron: '17,47 * * * *'
permissions:
  contents: write
concurrency:
  group: update-worldcup-teamlists
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install parser dependencies
        run: python -m pip install -r requirements.txt
      - name: Run fail-closed multi-round publisher tests
        run: python -m unittest test_update -v
      - name: Check the NRL.com official team lists
        run: python update_teamlists.py
      - name: Commit only verified differences
        run: |
          if git diff --quiet -- worldcup-teamlists.json; then
            echo "No verified changes to publish"
            exit 0
          fi
          git config user.name "worldcup-teamlist-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add worldcup-teamlists.json
          git commit -m "Update verified World Cup team lists"
          git push
