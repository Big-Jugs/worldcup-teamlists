name: Refresh World Cup team lists
on:
  workflow_dispatch:
  schedule:
    # Best-effort every five minutes; scheduled runs may be delayed by GitHub.
    - cron: '2,7,12,17,22,27,32,37,42,47,52,57 * * * *'
permissions:
  contents: write
concurrency:
  group: update-worldcup-teamlists
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install parser dependencies
        run: python -m pip install -r requirements.txt
      - name: Install Chromium for official-source fallback
        run: |
          python -m pip install playwright
          python -m playwright install chromium --with-deps
      - name: Run parser and knockout late-change regression tests
        run: |
          python -m unittest test_update -v
          python -m unittest test_teamlist_round4 -v
      - name: Verify CURRENT NRL.com team lists (fail closed if unavailable)
        run: python update_teamlists.py
      - name: Diagnose official team-list sources
        if: failure()
        run: |
          python - <<'PY'
          import requests
          from bs4 import BeautifulSoup
          from update_teamlists import parse_teams, complete_matchday

          urls = [
              "https://www.nrl.com/news/2026/11/03/world-cup-team-lists-mens-semi-finals/",
              "https://www.rlwc2026.com/news/world-cup-team-lists-mens-semi-finals",
              "https://www.seaeagles.com.au/news/2026/11/03/world-cup-team-lists-mens-semi-finals/",
          ]

          for url in urls:
              print("\nSOURCE:", url, flush=True)
              try:
                  response = requests.get(
                      url,
                      timeout=20,
                      headers={"User-Agent": "Mozilla/5.0"}
                  )
                  soup = BeautifulSoup(response.text, "html.parser")
                  title = soup.title.get_text(strip=True) if soup.title else "None"
                  teams = complete_matchday(parse_teams(response.text))

                  print("HTTP:", response.status_code)
                  print("Bytes:", len(response.content))
                  print("Title:", title)
                  print("Verified nations:", sorted(teams))
                  print("Page sample:", soup.get_text(" ", strip=True)[:200])
              except Exception as exc:
                  print("FETCH FAILED:", type(exc).__name__, str(exc)[:200])
          PY

      - name: Commit only verified differences
        run: |
          if git diff --quiet -- worldcup-teamlists.json; then
            echo "No verified changes to publish"
            exit 0
          fi
          git config user.name "worldcup-teamlist-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add worldcup-teamlists.json
          git commit -m "Update verified World Cup team lists"
          # Rebase safely if another workflow modified this branch.
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
