name: Refresh World Cup fantasy scores
on:
  workflow_dispatch:
    inputs:
      probe_2025:
        description: "Test 2025 England v Kangaroos without publishing"
        type: boolean
        required: false
        default: false
  schedule:
    - cron: '*/10 * * * *'
permissions:
  contents: write
concurrency:
  group: worldcup-fantasy-scoring
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install requests beautifulsoup4 pytest playwright
          python -m playwright install chromium --with-deps
      - name: Validate local match parser
        run: python test_fantasy_scores.py
      - name: Historical 2025 match probe (non-publishing)
        if: ${{ inputs.probe_2025 == true }}
        run: python refresh_fantasy_scores.py --probe-historical
      - name: Check 2026 World Cup official fantasy scores
        if: ${{ inputs.probe_2025 != true }}
        run: python refresh_fantasy_scores.py --browser
      - name: Publish verified feed to GitHub
        if: ${{ inputs.probe_2025 != true }}
        run: |
          if git diff --quiet -- worldcup-fantasy-scores.json; then
            echo "No new verified fantasy scores"
            exit 0
          fi
          git config user.name "worldcup-score-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add worldcup-fantasy-scores.json
          git commit -m "Update verified World Cup fantasy scores"
          git push
      - name: Publish verified scores to Supabase ladder
        if: ${{ inputs.probe_2025 != true }}
        env:
          WCF_SUPABASE_URL: ${{ secrets.WCF_SUPABASE_URL }}
          WCF_SUPABASE_SECRET_KEY: ${{ secrets.WCF_SUPABASE_SECRET_KEY }}
        run: python publish_scores_to_supabase.py
